```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Moechat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="site-title">
        Moechat
    </div>

    <div class="header-buttons">
        <button id="toggleAccount" class="header-button">Account</button>
        <button id="toggleCreate" class="header-button">New Post</button>
    </div>

</header>

<img
    class="banner"
    src="https://frostcat224.github.io/moechat/banners/logo.png"
    alt="Moechat"
>

<div class="forum-layout">

    <aside class="sidebar">

        <div class="sidebar-title">
            Moechat
        </div>

        <a href="https://frostcat224.github.io/moechat/">
            Home
        </a>

        <a href="https://frostcat224.github.io/moechat/top">
            Top
        </a>

        <a href="https://frostcat224.github.io/moechat/bottom">
            Bottom
        </a>

        <a href="https://frostcat224.github.io/moechat/recent">
            Recent
        </a>

        <a href="https://frostcat224.github.io/moechat/trending">
            Trending
        </a>

        <a href="https://frostcat224.github.io/moechat/news">
            News
        </a>

        <div class="sidebar-title">
            Account
        </div>

        <button id="sidebarAccount">
            Account
        </button>

        <button id="sidebarPost">
            Create Post
        </button>

    </aside>


    <main class="main-content">

        <div class="create" id="accountBox">

            <h3>Account</h3>

            <input id="username" placeholder="Username">

            <input
                id="email"
                type="email"
                placeholder="Email"
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
            >

            <button id="register">Register</button>
            <button id="login">Login</button>
            <button id="logout">Logout</button>

            <div id="status">Not logged in</div>

        </div>


        <div class="create" id="createBox">

            <h3>Create Post</h3>

            <div id="postStatus">
                Not logged in
            </div>

            <br>

            <input
                id="title"
                placeholder="Title"
            >

            <textarea
                id="content"
                rows="5"
                placeholder="Content"
            ></textarea>

            <label class="news-checkbox">
                <input
                    type="checkbox"
                    id="isNews"
                >
                Is a news article
            </label>

            <button id="submit">
                Post
            </button>

        </div>


        <div class="forum-header">
            Recent Posts
        </div>

        <div id="posts">
            Loading...
        </div>

    </main>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
```
