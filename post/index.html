
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Moechat</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<header class="header">

    <div class="site-title">
        Moechat
    </div>

    <nav class="nav">

        <a href="/moechat/">
            Home
        </a>

    </nav>

</header>




<div class="forum-layout">

    <main class="main-content">

        <div id="post">
            Loading...
        </div>


        <div class="commentBox">

            <h3>
                Add Comment
            </h3>

            <div id="loginStatus">
                Checking login...
            </div>

            <textarea
                id="commentText"
                rows="4"
                placeholder="Write comment..."
            ></textarea>

            <button id="sendComment">
                Comment
            </button>

        </div>


        <div class="comments">

            <div class="forum-header">
                Comments
            </div>

            <div id="comments">
                No comments
            </div>

        </div>

    </main>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
    getDatabase,
    ref,
    get,
    push,
    set,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyA75yvmawdHgeaHz0seDhGC5exvS-teIpc",

    authDomain:
        "moechat-224.firebaseapp.com",

    databaseURL:
        "https://moechat-224-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "moechat-224",

    storageBucket:
        "moechat-224.firebasestorage.app",

    messagingSenderId:
        "147503997820",

    appId:
        "1:147503997820:web:1bb59dc4936825af87baf9"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


const auth =
    getAuth(app);


const id =
    new URLSearchParams(
        location.search
    ).get("id");


const postDiv =
    document.getElementById("post");


const commentsDiv =
    document.getElementById("comments");


const loginStatus =
    document.getElementById("loginStatus");


let currentUser = null;


function date(ts) {

    return new Date(ts)
        .toLocaleString();

}


/* =========================
   LOAD POST
========================= */

async function loadPost() {

    if (!id) {

        postDiv.innerHTML =
            "Post not found";

        return;
    }


    const snap =
        await get(
            ref(
                db,
                "posts/" + id
            )
        );


    if (!snap.exists()) {

        postDiv.innerHTML =
            "Post missing";

        return;
    }


    const p =
        snap.val();


    document.title =
        p.title +
        " - Moechat";


    postDiv.innerHTML = `

        <div class="post">

            <div class="post-title">
                ${p.title}
            </div>


            <div class="post-meta">

                ${p.score || 0}

                •

                posted by
                ${p.author}

                •

                ${date(p.timestamp)}

            </div>


            <div class="post-content">
                ${p.content}
            </div>

        </div>

    `;

}


/* =========================
   LOAD COMMENTS
========================= */

function loadComments() {

    onValue(

        ref(
            db,
            "comments/" + id
        ),

        (s) => {

            if (!s.exists()) {

                commentsDiv.innerHTML =
                    "No comments";

                return;
            }


            let list =
                Object.entries(
                    s.val()
                );


            /* Newest comments first */

            list.sort(
                (a, b) =>
                    (b[1].timestamp || 0) -
                    (a[1].timestamp || 0)
            );


            let html = "";


            list.forEach(
                ([k, c]) => {

                    html += `

                        <div class="comment">

                            <div class="comment-author">
                                ${c.author}
                            </div>


                            <div class="comment-date">
                                ${date(c.timestamp)}
                            </div>


                            <div class="comment-content">
                                ${c.content}
                            </div>

                        </div>

                    `;

                }
            );


            commentsDiv.innerHTML =
                html;

        }
    );

}


/* =========================
   LOGIN
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        currentUser = user;


        if (user) {

            const u =
                await get(
                    ref(
                        db,
                        "users/" +
                        user.uid
                    )
                );


            loginStatus.textContent =
                "Logged in";


            window.username =
                u.val()?.username ||
                user.email;

        }

        else {

            loginStatus.textContent =
                "Login to comment";

        }

    }
);


/* =========================
   SEND COMMENT
========================= */

document
    .getElementById("sendComment")
    .onclick =
    async () => {

        if (!currentUser) {

            alert(
                "Login first"
            );

            return;
        }


        const text =
            document
                .getElementById(
                    "commentText"
                )
                .value
                .trim();


        if (!text) {

            return;
        }


        const newComment =
            push(
                ref(
                    db,
                    "comments/" + id
                )
            );


        await set(
            newComment,
            {

                content: text,

                author:
                    window.username,

                timestamp:
                    Date.now()

            }
        );


        document
            .getElementById(
                "commentText"
            )
            .value = "";

    };


loadPost();

loadComments();

</script>

</body>
</html>
